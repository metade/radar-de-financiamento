<!doctype html>
<html lang="{{ site.lang | default: 'pt-PT' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body class="min-h-screen bg-slate-50 text-ink antialiased">
    <a href="#conteudo" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:bg-white focus:px-4 focus:py-3 focus:shadow">Saltar para o conteúdo</a>
    <header class="border-b border-line bg-white">
      <div class="mx-auto flex max-w-6xl flex-col gap-4 px-5 py-5 sm:flex-row sm:items-center sm:justify-between">
        <a class="text-xl font-bold text-ink" href="{{ '/' | relative_url }}">Radar de Financiamento da UE</a>
        <nav aria-label="Navegação principal" class="flex gap-5 text-sm font-semibold">
          <a class="text-civic-blue hover:underline" href="{{ '/' | relative_url }}">Último relatório</a>
          <a class="text-civic-blue hover:underline" href="{{ '/arquivo/' | relative_url }}">Arquivo</a>
        </nav>
      </div>
    </header>
    <main id="conteudo">
      {{ content }}
    </main>
    <footer class="border-t border-line bg-white">
      <div class="mx-auto max-w-6xl px-5 py-8 text-sm text-slate-600">
        <p>Serviço experimental para apoiar a leitura rápida de oportunidades de financiamento público.</p>
      </div>
    </footer>
  </body>
</html>
