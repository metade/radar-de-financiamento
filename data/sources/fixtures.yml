opportunities:
  - id: cerv-citizens-2026
    title: Redes de Cidades para Participação Democrática
    programme: CERV
    deadline: "2026-09-17"
    funding_source: Comissão Europeia
    official_link: https://commission.europa.eu/funding-tenders/find-funding/eu-funding-programmes/citizens-equality-rights-and-values-programme_en
    eligible_applicants:
      - Municípios
      - Juntas de freguesia
      - Organizações da sociedade civil
    partnership_requirements: Requer parceria transnacional com entidades de vários países participantes.
    summary: Apoia redes de municípios e comunidades locais que promovam participação cívica, diálogo democrático e envolvimento dos cidadãos.
    themes:
      - civic_participation
      - community_development
      - equality
  - id: life-climate-local-2026
    title: Projetos Locais de Adaptação Climática
    programme: LIFE
    deadline: "2026-10-03"
    funding_source: CINEA
    official_link: https://cinea.ec.europa.eu/programmes/life_en
    eligible_applicants:
      - Autoridades locais
      - Entidades públicas
      - Organizações privadas sem fins lucrativos
    partnership_requirements: Consórcio recomendado quando o projeto envolve demonstração ou replicação noutros territórios.
    summary: Financia ações de adaptação climática, soluções baseadas na natureza, gestão de risco e capacitação de entidades públicas locais.
    themes:
      - climate
      - environment
      - public_space
  - id: erasmus-youth-participation-2026
    title: Participação Jovem na Vida Democrática Local
    programme: Erasmus+
    deadline: "2026-08-12"
    funding_source: Agência Nacional Erasmus+
    official_link: https://erasmus-plus.ec.europa.eu/programme-guide
    eligible_applicants:
      - Associações juvenis
      - Municípios
      - Escolas
    partnership_requirements: Pode ser desenvolvido com parceiros locais; algumas ações exigem dimensão internacional.
    summary: Apoia iniciativas que aproximem jovens dos processos democráticos locais e criem espaços de participação comunitária.
    themes:
      - civic_participation
      - volunteering
      - community_development
  - id: digital-europe-services-2026
    title: Serviços Públicos Digitais Acessíveis
    programme: Europa Digital
    deadline: "2026-11-21"
    funding_source: Comissão Europeia
    official_link: https://digital-strategy.ec.europa.eu/en/activities/digital-programme
    eligible_applicants:
      - Administração pública
      - Entidades públicas
      - Centros de competência
    partnership_requirements: Normalmente exige consórcio técnico com entidades especializadas.
    summary: Apoia a modernização de serviços públicos digitais, interoperabilidade, acessibilidade e melhoria da experiência dos cidadãos.
    themes:
      - digital_public_services
      - accessibility
      - inclusion
  - id: culture-small-scale-2026
    title: Cooperação Cultural Europeia de Pequena Escala
    programme: Europa Criativa
    deadline: "2026-07-28"
    funding_source: Comissão Europeia
    official_link: https://culture.ec.europa.eu/creative-europe
    eligible_applicants:
      - Organizações culturais
      - Associações
      - Entidades sem fins lucrativos
    partnership_requirements: Exige parceiros de pelo menos três países elegíveis.
    summary: Financia projetos culturais colaborativos com dimensão europeia e atividades públicas de envolvimento comunitário.
    themes:
      - community_development
      - inclusion
